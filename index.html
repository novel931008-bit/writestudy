<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Write Study</title>
<meta name="description" content="Write Study 的說明">
<style>
:root {
  --paper: #f6f3ec; --card: #fffdf8; --ink: #23201b; --ink2: #5a554b; --ink3: #8a8476;
  --rule: #e2dccf; --shu: #b8432f; --shu-soft: #f3e1da; --code: #efe9dc;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #1b1a17; --card: #23221e; --ink: #ece6d8; --ink2: #bdb5a4; --ink3: #8d8676;
    --rule: #3a372f; --shu: #e0765f; --shu-soft: #3a2520; --code: #2d2b25;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 16px/1.8 "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Heiti TC", system-ui, sans-serif;
  padding: 0 16px;
}
.wrap { max-width: 44rem; margin: 0 auto; padding-block: 40px 64px; }
header.site { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
.seal {
  width: 40px; height: 40px; border-radius: 8px; background: var(--shu); color: #fff;
  display: grid; place-items: center; font-weight: 700; font-size: 15px; letter-spacing: .02em; flex: none;
}
header.site a { color: var(--ink); text-decoration: none; font-weight: 600; font-size: 17px; }
nav.tabs { margin-left: auto; display: flex; gap: 4px; flex-wrap: wrap; }
nav.tabs a {
  font-size: 14px; color: var(--ink2); text-decoration: none; padding: 4px 10px; border-radius: 999px;
}
nav.tabs a[aria-current] { background: var(--shu-soft); color: var(--shu); }
h1 { font-size: 28px; line-height: 1.35; margin: 0 0 6px; text-wrap: balance; }
.updated { color: var(--ink3); font-size: 14px; margin: 0 0 28px; }
h2 {
  font-size: 19px; margin: 40px 0 12px; padding-top: 20px; border-top: 1px solid var(--rule); text-wrap: balance;
}
h3 { font-size: 16px; margin: 24px 0 8px; color: var(--ink); }
p, ul { margin: 0 0 14px; }
ul { padding-left: 1.3em; }
li { margin: 4px 0; }
strong { color: var(--ink); font-weight: 700; }
code { background: var(--code); padding: 1px 6px; border-radius: 4px; font-size: .9em; }
a { color: var(--shu); }
.table { overflow-x: auto; margin: 0 0 16px; border: 1px solid var(--rule); border-radius: 10px; background: var(--card); }
table { border-collapse: collapse; width: 100%; font-size: 15px; }
th, td { text-align: left; vertical-align: top; padding: 10px 14px; border-bottom: 1px solid var(--rule); }
tr:last-child td { border-bottom: 0; }
th { font-weight: 600; color: var(--ink2); font-size: 13px; letter-spacing: .04em; white-space: nowrap; }
.callout { background: var(--card); border: 1px solid var(--rule); border-left: 3px solid var(--shu); border-radius: 8px; padding: 14px 16px; }
.cards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); margin-top: 24px; }
.cards a {
  display: block; background: var(--card); border: 1px solid var(--rule); border-radius: 12px; padding: 18px;
  color: var(--ink); text-decoration: none;
}
.cards a:hover { border-color: var(--shu); }
.cards b { display: block; font-size: 17px; margin-bottom: 4px; }
.cards span { color: var(--ink2); font-size: 14px; }
footer { margin-top: 56px; padding-top: 16px; border-top: 1px solid var(--rule); color: var(--ink3); font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
<header class="site"><div class="seal" aria-hidden="true">WS</div><a href="./">Write Study</a><nav class="tabs"><a href="privacy.html">隱私權政策</a><a href="terms.html">使用條款</a></nav></header>
<main>
<h1>Write Study</h1>
<p class="updated">給大學生的講義閱讀、筆記、錄音轉錄與 AI 複習工具</p>
<p class="callout">你的講義、筆記與錄音只存在你的裝置,以及(你開啟同步時)你自己的 Google 雲端硬碟。本 App 沒有自己的伺服器,沒有廣告與追蹤。</p>

<a href="privacy.html"><b>隱私權政策</b><span>處理哪些資料、送到哪裡、怎麼保護</span></a>
<a href="terms.html"><b>使用條款與免責聲明</b><span>AI 內容的限制、著作權與第三方服務</span></a>
</div>
<p style="margin-top:28px">聯絡開發者:<a href="mailto:cmu.learning.service@gmail.com">cmu.learning.service@gmail.com</a></p>
</main>
<footer>Write Study · 個人開發者開發與維護</footer>
</div>
</body>
</html>
